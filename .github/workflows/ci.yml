name: Phase 10 production candidate gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase-10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ragflow_agent
          POSTGRES_USER: ragflow_agent
          POSTGRES_PASSWORD: phase01-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragflow_agent -d ragflow_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      RAGFLOW_AGENT_DATABASE__URL: postgresql+psycopg://ragflow_agent:phase01-ci-only@127.0.0.1:5432/ragflow_agent
      RAGFLOW_AGENT_TEST_DATABASE_URL: postgresql+psycopg://ragflow_agent:phase01-ci-only@127.0.0.1:5432/ragflow_agent
      RAGFLOW_AGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RAGFLOW_AGENT_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9200
      RAGFLOW_AGENT_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      RAGFLOW_AGENT_TEST_S3_ACCESS_KEY: phase04-ci-minio
      RAGFLOW_AGENT_TEST_S3_SECRET_KEY: phase04-ci-minio-secret
      RAGFLOW_AGENT_DEV_POSTGRES_PASSWORD: phase01-ci-only
      RAGFLOW_AGENT_DEV_MINIO_ROOT_USER: phase04-ci-minio
      RAGFLOW_AGENT_DEV_MINIO_ROOT_PASSWORD: phase04-ci-minio-secret
      RAGFLOW_AGENT_TEST_REQUIRE_TESSERACT: "1"
      RAGFLOW_AGENT_INGESTION__OCR_LANGUAGES: eng+chi_sim

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-groups
          uv pip check

      - name: Install OCR runtime and declared language packs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-cjk tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim

      - name: Start MinIO
        run: |
          docker run --detach --name phase04-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=phase04-ci-minio \
            --env MINIO_ROOT_PASSWORD=phase04-ci-minio-secret \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl --fail http://127.0.0.1:9000/minio/health/live

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/ragflow_agent tests

      - name: Secret hygiene
        run: |
          uv run python scripts/check_secret_hygiene.py
          uv run python scripts/check_repository_governance.py --output /tmp/governance-scan.json

      - name: Deterministic datasets and release gates
        run: |
          uv run python -m ragflow_agent.evaluation.dataset datasets/phase10/v1/manifest.json
          uv run python -m ragflow_agent.knowledge.advanced.evaluation \
            --dataset datasets/phase09/v1/manifest.json \
            --output /tmp/phase09-evaluation.json
          uv run python -m ragflow_agent.evaluation.runner \
            --dataset datasets/phase10/v1/manifest.json \
            --output /tmp/phase10-evaluation.json
          uv run python -m ragflow_agent.operations.verification \
            --evaluation /tmp/phase10-evaluation.json \
            --governance /tmp/governance-scan.json \
            --operations-output /tmp/operations.json \
            --release-output /tmp/release-report.json \
            --commit "${GITHUB_SHA}"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

      - name: Migration round trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Bootstrap and Compose checks
        run: |
          uv run python -m ragflow_agent.bootstrap.api --check
          uv run python -m ragflow_agent.bootstrap.ingestion_worker --check
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose --env-file deploy/production.env.example \
            -f deploy/docker-compose.prod.yml config --quiet

      - name: Dependency audit and reproducible SBOM
        env:
          PYTHONUTF8: "1"
        run: |
          timeout 180 uv run pip-audit --vulnerability-service osv \
            --progress-spinner off --format json --output /tmp/dependency-audit.json
          uv run cyclonedx-py environment .venv --pyproject pyproject.toml \
            --output-reproducible --output-format JSON \
            --output-file /tmp/ragflow-agent-sbom.json --validate

      - name: Build linux amd64 production image and verify non-root
        run: |
          docker build --platform linux/amd64 \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag ragflow-agent:production-candidate .
          test "$(docker image inspect --format '{{.Config.User}}' ragflow-agent:production-candidate)" = "ragflow-agent"
          docker run --rm --entrypoint python ragflow-agent:production-candidate \
            -m ragflow_agent.bootstrap.api --check
          docker run --rm --entrypoint python ragflow-agent:production-candidate \
            -m ragflow_agent.bootstrap.ingestion_worker --check
