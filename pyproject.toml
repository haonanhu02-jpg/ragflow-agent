[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ragflow-agent"
version = "0.1.0"
description = "An independent Agent and RAG system inspired by RAGFlow."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "arq>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "boto3>=1.39,<2",
    "charset-normalizer>=3.4,<4",
    "defusedxml>=0.7,<1",
    "elasticsearch[async]>=8.19,<9",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.5,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "markdown-it-py>=4,<5",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<0.12",
    "pillow>=11.3,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "pytesseract>=0.3.13,<0.4",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
# Reserved for future model-backed parser profiles. Phase 05's baseline
# libraries are runtime dependencies because all eight formats are supported
# by the default ingestion worker.
parser = []

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=7,<8",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
    "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragflow_agent"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["ragflow_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
