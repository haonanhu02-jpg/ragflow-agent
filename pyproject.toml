[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ragflow-agent"
version = "0.1.0"
description = "An independent Agent and RAG system inspired by RAGFlow."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.39,<2",
    "fastapi>=0.116,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.5,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
# Parser dependencies remain isolated and will be selected only after the
# Phase 05 compatibility, licensing, and resource audit.
parser = []

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragflow_agent"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["ragflow_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
