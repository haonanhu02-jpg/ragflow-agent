name: ragflow-agent-dev

services:
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ragflow_agent
      POSTGRES_USER: ragflow_agent
      POSTGRES_PASSWORD: ${RAGFLOW_AGENT_DEV_POSTGRES_PASSWORD:?set RAGFLOW_AGENT_DEV_POSTGRES_PASSWORD}
    ports:
      - "${RAGFLOW_AGENT_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragflow_agent -d ragflow_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RAGFLOW_AGENT_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_USER:?set RAGFLOW_AGENT_DEV_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_PASSWORD:?set RAGFLOW_AGENT_DEV_MINIO_ROOT_PASSWORD}
    ports:
      - "${RAGFLOW_AGENT_DEV_MINIO_PORT:-9000}:9000"
      - "${RAGFLOW_AGENT_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${RAGFLOW_AGENT_DEV_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:9200/_cluster/health?wait_for_status=yellow",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ragflow_agent.bootstrap.api"]
    environment:
      RAGFLOW_AGENT_ENVIRONMENT: development
      RAGFLOW_AGENT_DATABASE__URL: postgresql+psycopg://ragflow_agent:${RAGFLOW_AGENT_DEV_POSTGRES_PASSWORD}@postgres:5432/ragflow_agent
      RAGFLOW_AGENT_QUEUE__URL: redis://redis:6379/0
      RAGFLOW_AGENT_OBJECT_STORE__ENDPOINT_URL: http://minio:9000
      RAGFLOW_AGENT_OBJECT_STORE__BUCKET: ragflow-agent
      RAGFLOW_AGENT_OBJECT_STORE__ACCESS_KEY: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_USER}
      RAGFLOW_AGENT_OBJECT_STORE__SECRET_KEY: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_PASSWORD}
      RAGFLOW_AGENT_SEARCH__URL: http://elasticsearch:9200
      RAGFLOW_AGENT_SEARCH__VERIFY_CERTS: "false"
      RAGFLOW_AGENT_MODELS__CHAT_MODEL: ${RAGFLOW_AGENT_MODELS__CHAT_MODEL:-deepseek-chat}
      RAGFLOW_AGENT_MODELS__CHAT_BASE_URL: ${RAGFLOW_AGENT_MODELS__CHAT_BASE_URL:-https://api.deepseek.com}
      RAGFLOW_AGENT_MODELS__CHAT_API_KEY: ${RAGFLOW_AGENT_MODELS__CHAT_API_KEY:-}
      RAGFLOW_AGENT_MODELS__EMBEDDING_MODEL: ${RAGFLOW_AGENT_MODELS__EMBEDDING_MODEL:-BAAI/bge-m3}
      RAGFLOW_AGENT_MODELS__EMBEDDING_BASE_URL: ${RAGFLOW_AGENT_MODELS__EMBEDDING_BASE_URL:-http://host.docker.internal:8080/v1}
      RAGFLOW_AGENT_MODELS__EMBEDDING_API_KEY: ${RAGFLOW_AGENT_MODELS__EMBEDDING_API_KEY:-}
      RAGFLOW_AGENT_MODELS__EMBEDDING_DIMENSIONS: ${RAGFLOW_AGENT_MODELS__EMBEDDING_DIMENSIONS:-1024}
      RAGFLOW_AGENT_MODELS__RERANKER_MODEL: ${RAGFLOW_AGENT_MODELS__RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAGFLOW_AGENT_MODELS__RERANKER_BASE_URL: ${RAGFLOW_AGENT_MODELS__RERANKER_BASE_URL:-}
      RAGFLOW_AGENT_MODELS__RERANKER_API_KEY: ${RAGFLOW_AGENT_MODELS__RERANKER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RAGFLOW_AGENT_DEV_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ragflow_agent.bootstrap.ingestion_worker"]
    environment:
      RAGFLOW_AGENT_ENVIRONMENT: development
      RAGFLOW_AGENT_DATABASE__URL: postgresql+psycopg://ragflow_agent:${RAGFLOW_AGENT_DEV_POSTGRES_PASSWORD}@postgres:5432/ragflow_agent
      RAGFLOW_AGENT_QUEUE__URL: redis://redis:6379/0
      RAGFLOW_AGENT_OBJECT_STORE__ENDPOINT_URL: http://minio:9000
      RAGFLOW_AGENT_OBJECT_STORE__BUCKET: ragflow-agent
      RAGFLOW_AGENT_OBJECT_STORE__ACCESS_KEY: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_USER}
      RAGFLOW_AGENT_OBJECT_STORE__SECRET_KEY: ${RAGFLOW_AGENT_DEV_MINIO_ROOT_PASSWORD}
      RAGFLOW_AGENT_SEARCH__URL: http://elasticsearch:9200
      RAGFLOW_AGENT_SEARCH__VERIFY_CERTS: "false"
      RAGFLOW_AGENT_MODELS__EMBEDDING_MODEL: ${RAGFLOW_AGENT_MODELS__EMBEDDING_MODEL:-BAAI/bge-m3}
      RAGFLOW_AGENT_MODELS__EMBEDDING_BASE_URL: ${RAGFLOW_AGENT_MODELS__EMBEDDING_BASE_URL:-http://host.docker.internal:8080/v1}
      RAGFLOW_AGENT_MODELS__EMBEDDING_API_KEY: ${RAGFLOW_AGENT_MODELS__EMBEDDING_API_KEY:-}
      RAGFLOW_AGENT_MODELS__EMBEDDING_DIMENSIONS: ${RAGFLOW_AGENT_MODELS__EMBEDDING_DIMENSIONS:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  elasticsearch-data:
